# Déploiement automatique sur le VPS à chaque envoi sur main (équivalent de « ./deploy.sh » lancé à la main).
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) :
#   VPS_HOST     adresse IP ou nom du VPS
#   VPS_USER     utilisateur SSH (ubuntu)
#   VPS_SSH_KEY_B64  clé privée SSH dédiée au déploiement, encodée en base64 sur une seule ligne
#                    (évite les erreurs de copier-coller des retours à la ligne ; `base64 -w0 ~/.ssh/deploy_github`)
name: Déploiement VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Préparer SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Lancer deploy.sh sur le VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            'bash -lc "[ -s ~/.nvm/nvm.sh ] && . ~/.nvm/nvm.sh; cd ~/outils-meteo && ./deploy.sh"'
