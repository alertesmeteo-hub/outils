services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meteo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meteo}
      POSTGRES_DB: meteo
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meteo']
      interval: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    ports: ['3000:3000']
    environment:
      DATABASE_URL: postgresql://meteo:${POSTGRES_PASSWORD:-meteo}@db:5432/meteo
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      EMBED_ALLOWED_ORIGINS: ${EMBED_ALLOWED_ORIGINS:-}

volumes:
  pgdata:
